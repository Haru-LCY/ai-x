<text x="58.96" y="258.37" text-anchor="start" xml:space="preserve" font-size="32" fill="#660874"><tspan> </tspan><tspan fill="#3D3D3D">Many real-world manipulation tasks are </tspan><tspan>dynamic</tspan><tspan fill="#3D3D3D">, not just static pick-</tspan><tspan x="58.96" dy="38.4" fill="#3D3D3D">and-place.</tspan></text>
<text x="58.96" y="343.17" text-anchor="start" xml:space="preserve" font-size="32" fill="#660874"><tspan> </tspan><tspan fill="#3D3D3D">Success in these tasks depends on accurate estimation of </tspan><tspan>key </tspan><tspan x="58.96" dy="38.4">mechanical parameters</tspan><tspan fill="#3D3D3D">:</tspan></text>
<text x="58.96" y="421.17" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>   </tspan><tspan fill="#3D3D3D">Mass (m) — affects inertia and gravitational response.</tspan></text>
<text x="58.96" y="457.97" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>   </tspan><tspan fill="#3D3D3D">Center of Mass (</tspan><tspan fill="#3D3D3D">CoM</tspan><tspan fill="#3D3D3D">) — influences balance and torque.</tspan></text>
<text x="58.96" y="494.77" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>   </tspan><tspan fill="#3D3D3D">Friction (</tspan><tspan fill="#3D3D3D">μ) — </tspan><tspan fill="#3D3D3D">governs how the object slides or sticks against the gripper.</tspan></text>
<text x="58.96" y="531.57" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>   </tspan><tspan fill="#3D3D3D">Moment of Inertia (I) — determines rotational acceleration and stability.</tspan></text>
<text x="58.96" y="575.17" text-anchor="start" xml:space="preserve" font-size="32" fill="#660874"><tspan> </tspan><tspan fill="#3D3D3D">Small errors in these parameters can lead to </tspan><tspan>large differences</tspan><tspan fill="#3D3D3D"> in the </tspan><tspan x="58.96" dy="38.4" fill="#3D3D3D">results of a dynamic task.</tspan></text>
<text x="58.96" y="659.97" text-anchor="start" xml:space="preserve" font-size="32" fill="#660874"><tspan> </tspan><tspan fill="#3D3D3D">How can robots develop an </tspan><tspan>accurate</tspan><tspan> </tspan><tspan>estimation</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">of</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">mechanical</tspan><tspan fill="#3D3D3D"> </tspan></text>
</g>
