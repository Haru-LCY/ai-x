<text x="70.62" y="245.23" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan>  </tspan><tspan>Input</tspan><tspan fill="#3D3D3D">：</tspan><tspan fill="#3D3D3D">Real-world signals</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">during</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">exploration.</tspan></text>
<text x="70.62" y="282.03" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan>•  </tspan><tspan>Output</tspan><tspan fill="#3D3D3D">：</tspan><tspan fill="#3D3D3D">High-resolution tactile images</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">that</tspan><tspan fill="#3D3D3D"> encodes local contact geometry, normal/shear </tspan><tspan x="70.62" dy="28.8" fill="#3D3D3D">force, torque, and texture information.</tspan></text>
<text x="70.62" y="347.63" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>•  </tspan><tspan>Key point</tspan><tspan fill="#3D3D3D">: ONLY use the raw m</tspan><tspan fill="#3D3D3D" font-family="inherit, &quot;华文中宋&quot;, &quot;Gill Sans MT&quot;, sans-serif">arker displacements</tspan><tspan fill="#3D3D3D" font-family="inherit, &quot;华文中宋&quot;, &quot;Gill Sans MT&quot;, sans-serif" font-weight="bold">​</tspan><tspan fill="#3D3D3D">​ from high-resolution </tspan><tspan fill="#3D3D3D">GelSight</tspan><tspan fill="#3D3D3D"> images.</tspan></text>
<text x="70.62" y="384.43" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874"><tspan>•  </tspan><tspan>Advantage</tspan><tspan fill="#3D3D3D">:</tspan><tspan fill="#3D3D3D"> </tspan><tspan fill="#3D3D3D">keep rich information of the contact surface</tspan></text>
<text x="70.62" y="421.23" text-anchor="start" xml:space="preserve" font-size="24" fill="#3D3D3D">while avoiding the error caused by the nonlinear mechanical</text>
