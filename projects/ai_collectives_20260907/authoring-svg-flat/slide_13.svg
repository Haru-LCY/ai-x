<text x="46.32" y="284.95" text-anchor="start" xml:space="preserve" font-size="24" fill="#660874" data-pptx-text-model="paragraphs" data-paragraph-line-height="36"><tspan><tspan>  </tspan><tspan fill="#3D3D3D">Dataset: </tspan><tspan>33 modular objects</tspan><tspan fill="#3D3D3D"> built from interchangeable handles, racks, and weights.</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>  </tspan><tspan fill="#3D3D3D">Data Collection</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>   </tspan><tspan fill="#3D3D3D">Each object: 50 swing-up trials → ~1650 total samples.</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>   </tspan><tspan fill="#3D3D3D">Automatic reset system allows continuous autonomous trials.</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>  </tspan><tspan fill="#3D3D3D">Training</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>   </tspan><tspan>End-to-end self-supervised learning </tspan><tspan fill="#3D3D3D">using final angle as supervision.</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>   </tspan><tspan>Loss</tspan><tspan fill="#3D3D3D">: prediction error between predicted and measured swing-up angles.</tspan></tspan><tspan data-paragraph-space-before="0.8"><tspan>  </tspan><tspan fill="#3D3D3D">Inference: sample control parameters, choose the one with predicted angle closest to goal.</tspan></tspan></text>
</g>
