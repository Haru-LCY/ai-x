<text x="51.42" y="587.21" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">  </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">Output</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">: an embedding that encodes </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">friction and</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67"> </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">moment</tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67"> </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">of inertia.</tspan></text>
