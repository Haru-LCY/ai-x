<text x="51.42" y="251.21" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">  </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">Simple dynamic process encodes rich information for complex dynamic </tspan><tspan x="51.42" dy="32" fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="26.67">tasks</tspan></text>
