<text x="58.96" y="258.37" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">Many real-world manipulation tasks are </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">dynamic</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">, not just static pick-</tspan><tspan x="58.96" dy="38.4" fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">and-place.</tspan></text>
<text x="58.96" y="343.17" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">Success in these tasks depends on accurate estimation of </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">key </tspan><tspan x="58.96" dy="38.4" fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">mechanical parameters</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">:</tspan></text>
<text x="58.96" y="421.17" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">   </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">Mass (m) — affects inertia and gravitational response.</tspan></text>
<text x="58.96" y="457.97" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">   </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">Center of Mass (</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">CoM</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">) — influences balance and torque.</tspan></text>
<text x="58.96" y="494.77" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">   </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">Friction (</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">μ) — </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">governs how the object slides or sticks against the gripper.</tspan></text>
<text x="58.96" y="531.57" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">   </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="24">Moment of Inertia (I) — determines rotational acceleration and stability.</tspan></text>
<text x="58.96" y="575.17" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">Small errors in these parameters can lead to </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">large differences</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> in the </tspan><tspan x="58.96" dy="38.4" fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">results of a dynamic task.</tspan></text>
<text x="58.96" y="659.97" text-anchor="start" xml:space="preserve" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32" fill="#660874"><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">How can robots develop an </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">accurate</tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#660874" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">estimation</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">of</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32">mechanical</tspan><tspan fill="#3D3D3D" font-family="&quot;Gill Sans MT&quot;, &quot;华文中宋&quot;, sans-serif" font-size="32"> </tspan></text>
</g>
